<symbol id="ic-files" viewBox="0 0 18 18"><defs><linearGradient id="files-ba3d4428-273b-47d2-80ac-53671019b795" x1="-1267.23" y1="3.07" x2="-1267.52" y2="14.64" gradientTransform="matrix(-1, 0, 0, 1, -1256.13, 0)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#32d4f5" /><stop offset="0.23" stop-color="#31d0f1" /><stop offset="0.46" stop-color="#2cc3e6" /><stop offset="0.7" stop-color="#25afd4" /><stop offset="0.94" stop-color="#1c92ba" /><stop offset="1" stop-color="#198ab3" /></linearGradient></defs><g id="files-bce83c25-9afe-4c01-b0b0-4312ccacb0c8"><g><path d="M17.28,3.9h-.91a4.16,4.16,0,0,0-.55,0,.68.68,0,0,1-.59-1l.39-.7a1.83,1.83,0,0,0-.51-.29l-.93,1.66a.7.7,0,0,1-.6.35h-.83a.66.66,0,0,0-.32.08h0L10.86,5a.25.25,0,0,1-.16,0H5.27A.29.29,0,0,0,5,5.32v4.82l-1.75.54.13.56L5,11V13.9a.29.29,0,0,0,.29.29h9.37l1.15,1.49.49-.31-.68-1.18h1.68a.29.29,0,0,0,.3-.29V4.2A.3.3,0,0,0,17.28,3.9Z" fill="#005ba1" /><circle cx="15.88" cy="1.08" r="1.09" fill="#50e5ff" /><circle cx="16.58" cy="16.59" r="1.42" fill="#50e5ff" /><circle cx="1.77" cy="11.44" r="1.77" fill="#50e5ff" /><g><path d="M15.17,4.75l-6.91-1H8.12a1,1,0,0,0-1,.87L6.86,6.31H16L16,5.9A1,1,0,0,0,15.17,4.75Z" fill="#0078d4" /><path d="M15.1,5.18l-6.9-1H8.11a.58.58,0,0,0-.57.5L7.3,6.31h8.22l.07-.47A.58.58,0,0,0,15.1,5.18Z" fill="#fff" /></g><path d="M5.26,5h6.05a.33.33,0,0,1,.21.09l1,1a.29.29,0,0,0,.21.09h4.6a.3.3,0,0,1,.3.29V13.9a.3.3,0,0,1-.3.29h-12A.29.29,0,0,1,5,13.9V5.32A.3.3,0,0,1,5.26,5Z" fill="url(#files-ba3d4428-273b-47d2-80ac-53671019b795)" /></g></g></symbol>
</defs>
<rect x="0" y="0" width="1000" height="584" rx="10" fill="#ffffff" stroke="#e3e8ef" stroke-width="1"/>
<text x="24" y="34" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#101828" text-anchor="start">How two instances cooperate</text>
<text x="24" y="55" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">Nothing here is App-Service-specific: every mechanism coordinates through the store and the share.</text>
<rect x="30" y="100" width="254" height="77" rx="9" fill="#ffffff" stroke="#c9d8e8" stroke-width="1.25"/>
<use href="#ic-appservice" x="44" y="114" width="26" height="26"/>
<text x="80" y="127.5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#101828" text-anchor="start">Instance 1</text>
<text x="80" y="144" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">claims jobs · beats every 15s</text>
<text x="80" y="159" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">watches every input folder</text>
<rect x="30" y="199" width="254" height="77" rx="9" fill="#ffffff" stroke="#c9d8e8" stroke-width="1.25"/>
<use href="#ic-appservice" x="44" y="213" width="26" height="26"/>
<text x="80" y="226.5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#101828" text-anchor="start">Instance 2</text>
<text x="80" y="243" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">claims jobs · beats every 15s</text>
<text x="80" y="258" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">watches every input folder</text>
<rect x="380" y="84" width="320" height="304" rx="12" fill="#f4f8fd" stroke="#b7d3ee" stroke-width="1.25" stroke-dasharray="6 4"/>
<text x="396" y="108" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15497a" text-anchor="start">Azure SQL — the operational store</text>
<text x="396" y="124" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">the cluster’s coordination point</text>
<rect x="398" y="132" width="284" height="40" rx="7" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.1"/>
<text x="410" y="149" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#101828" text-anchor="start">Job claim and owner</text>
<text x="410" y="163" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5b6472" text-anchor="start">one owner per job, from the claim</text>
<rect x="398" y="180" width="284" height="40" rx="7" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.1"/>
<text x="410" y="197" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#101828" text-anchor="start">Heartbeat table</text>
<text x="410" y="211" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5b6472" text-anchor="start">who is alive, and on what version</text>
<rect x="398" y="228" width="284" height="40" rx="7" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.1"/>
<text x="410" y="245" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#101828" text-anchor="start">Pipeline pause flag</text>
<text x="410" y="259" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5b6472" text-anchor="start">one row every worker reads each poll</text>
<rect x="398" y="276" width="284" height="40" rx="7" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.1"/>
<text x="410" y="293" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#101828" text-anchor="start">Session key ring</text>
<text x="410" y="307" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5b6472" text-anchor="start">a cookie minted anywhere validates everywhere</text>
<rect x="398" y="324" width="284" height="40" rx="7" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.1"/>
<text x="410" y="341" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.8" font-weight="600" fill="#101828" text-anchor="start">Job statistics</text>
<text x="410" y="355" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5b6472" text-anchor="start">computed on read, so it describes the fleet</text>
<rect x="748" y="170" width="252" height="101" rx="9" fill="#ffffff" stroke="#c9d8e8" stroke-width="1.25"/>
<use href="#ic-files" x="762" y="184" width="26" height="26"/>
<text x="798" y="197.5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#101828" text-anchor="start">Azure Files share</text>
<text x="798" y="214" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">the work tree, and a marker</text>
<text x="798" y="229" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">naming its operational store</text>
<rect x="798" y="238.5" width="122" height="18" rx="9" fill="#eef5fc" stroke="#c5dcf2" stroke-width="1"/>
<text x="806" y="251.3" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="10.2" font-weight="600" fill="#0078d4" text-anchor="start">bound to one store</text>
<path d="M284,138.5 C330,138.5 330,200 376,200" fill="none" stroke="#0078d4" stroke-width="1.6" marker-end="url(#ah-azure)"/>
<path d="M284,237.5 C330,237.5 330,300 376,300" fill="none" stroke="#0078d4" stroke-width="1.6" marker-end="url(#ah-azure)"/>
<path d="M700,250 C722,250 722,220.5 744,220.5" fill="none" stroke="#0078d4" stroke-width="1.6" marker-end="url(#ah-azure)"/>
<rect x="30" y="414" width="940" height="88" rx="9" fill="#fbfcfe" stroke="#d5dbe4" stroke-width="1"/>
<text x="48" y="438" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#101828" text-anchor="start">What it buys, and what it costs</text>
<text x="48" y="460" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#2f3944" text-anchor="start">A job is never processed by two instances at once, an instance dying leaves no work permanently stuck, and the pipeline keeps signing while</text>
<text x="48" y="478" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#2f3944" text-anchor="start">one host is gone. The wake signal stays process-local, so Pipeline:PollIntervalSeconds is the cluster’s cross-instance latency bound.</text>
<text x="30" y="530" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">A presumed death is a wager: an instance that is alive but cannot write heartbeats may have its work taken over while it is still doing it. What</text>
<text x="30" y="546" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">bounds the damage all predates cluster mode — the staged bytes are re-hashed immediately before any signature exists, a promote onto an</text>
<text x="30" y="562" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">occupied destination is refused, and an input is compared against its staging fingerprint before it is deleted.</text>
</svg>
