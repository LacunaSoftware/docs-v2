name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Deployed to the custom domain docs.lacunasoftware.com, served at the
      # domain ROOT — so the build uses the default baseUrl '/' and
      # url https://docs.lacunasoftware.com (see docusaurus.config.ts). That root
      # serving is what gives the classic URL parity (/en-us/articles/…). The
      # custom domain is pinned for GitHub Pages by static/CNAME.
      #
      # To instead preview on the default GitHub Pages project URL
      # (https://lacunasoftware.github.io/docs-v2/), delete static/CNAME and add:
      #     env:
      #       DOCS_BASE_URL: /docs-v2/
      #       DOCS_URL: https://lacunasoftware.github.io
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
