<symbol id="ic-keyvault" viewBox="0 0 18 18"><defs><radialGradient id="keyvault-fb114c93-7c16-4540-899a-0796041629e6" cx="9" cy="9" r="8.5" gradientUnits="userSpaceOnUse"><stop offset="0.18" stop-color="#5ea0ef" /><stop offset="0.56" stop-color="#5c9fee" /><stop offset="0.69" stop-color="#559ced" /><stop offset="0.78" stop-color="#4a97e9" /><stop offset="0.86" stop-color="#3990e4" /><stop offset="0.93" stop-color="#2387de" /><stop offset="0.99" stop-color="#087bd6" /><stop offset="1" stop-color="#0078d4" /></radialGradient><radialGradient id="keyvault-ec478bd3-5b38-4e7f-b661-11f355578bff" cx="38.95" cy="182.07" r="9.88" gradientTransform="translate(-28.71 -163.24) scale(0.94 0.94)" gradientUnits="userSpaceOnUse"><stop offset="0.27" stop-color="#ffd70f" /><stop offset="0.49" stop-color="#ffcb12" /><stop offset="0.88" stop-color="#feac19" /><stop offset="1" stop-color="#fea11b" /></radialGradient></defs><title>Icon-security-245</title><path id="keyvault-aacf8311-a317-400f-b613-74bd00da5ce3" d="M9,.5A8.5,8.5,0,1,0,17.5,9,8.51,8.51,0,0,0,9,.5ZM9,16.34A7.34,7.34,0,1,1,16.34,9,7.34,7.34,0,0,1,9,16.34Z" fill="url(#keyvault-fb114c93-7c16-4540-899a-0796041629e6)" /><circle cx="9" cy="9" r="7.34" fill="#fff" /><g><path id="keyvault-bd983c41-db73-40ec-a4f4-da1213fc9924" d="M13.44,7.33a1.84,1.84,0,0,0,0-2.59h0L10.29,1.58a1.83,1.83,0,0,0-2.58,0h0L4.56,4.74a1.84,1.84,0,0,0,0,2.59L7.18,10a.51.51,0,0,1,.15.36v4.88a.63.63,0,0,0,.18.44l1.2,1.2a.41.41,0,0,0,.58,0l1.16-1.16h0l.68-.68a.25.25,0,0,0,0-.34l-.49-.49a.27.27,0,0,1,0-.37l.49-.49a.25.25,0,0,0,0-.34l-.49-.49a.27.27,0,0,1,0-.37l.49-.49a.25.25,0,0,0,0-.34l-.68-.69v-.25ZM9,2.35A1,1,0,0,1,9,4.42,1,1,0,1,1,9,2.35Z" fill="url(#keyvault-ec478bd3-5b38-4e7f-b661-11f355578bff)" /><path id="keyvault-ad2e7e44-9bfd-4775-8bf4-8ef26a544921" d="M8.18,15.3h0a.23.23,0,0,0,.38-.17v-4a.24.24,0,0,0-.11-.2h0a.22.22,0,0,0-.34.2v4A.28.28,0,0,0,8.18,15.3Z" fill="#ff9300" opacity="0.75" /><rect id="keyvault-a996fbff-3936-4b24-b407-369336c143ba" x="6.48" y="5.79" width="5.17" height="0.61" rx="0.28" fill="#ff9300" opacity="0.75" /><rect id="keyvault-bb12d31c-3352-4a18-87dd-a169a4a8721d" x="6.48" y="6.78" width="5.17" height="0.61" rx="0.28" fill="#ff9300" opacity="0.75" /></g></symbol>
</defs>
<rect x="0" y="0" width="980" height="462" rx="10" fill="#ffffff" stroke="#e3e8ef" stroke-width="1"/>
<text x="24" y="34" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#101828" text-anchor="start">One vault, two objects, two credentials</text>
<text x="24" y="55" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">The single asymmetry in the topology: six grants need no secret, and exactly one does.</text>
<rect x="20" y="84" width="320" height="232" rx="12" fill="#f6f9fc" stroke="#c9d8e8" stroke-width="1.25" stroke-dasharray="6 4"/>
<text x="36" y="108" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15497a" text-anchor="start">The web app</text>
<text x="36" y="124" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">two principals, one of them a secret</text>
<rect x="38" y="136" width="284" height="77" rx="9" fill="#ffffff" stroke="#c9d8e8" stroke-width="1.25"/>
<use href="#ic-identity" x="52" y="150" width="26" height="26"/>
<text x="88" y="163.5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#101828" text-anchor="start">Managed identity</text>
<text x="88" y="180" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">resolves the Key Vault reference</text>
<text x="88" y="195" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">in the AppSecret app setting</text>
<rect x="38" y="225" width="284" height="62" rx="9" fill="#fdf4ec" stroke="#e6bd93" stroke-width="1.25"/>
<use href="#ic-appreg" x="52" y="239" width="26" height="26"/>
<text x="88" y="252.5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#101828" text-anchor="start">App registration</text>
<text x="88" y="269" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">presents its client secret to sign</text>
<rect x="468" y="84" width="492" height="232" rx="12" fill="#f6f9fc" stroke="#c9d8e8" stroke-width="1.25" stroke-dasharray="6 4"/>
<text x="484" y="108" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15497a" text-anchor="start">One Key Vault</text>
<text x="484" y="124" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6472" text-anchor="start">two objects, two grants</text>
<rect x="486" y="136" width="456" height="86" rx="9" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.25"/>
<use href="#ic-keyvault" x="500" y="150" width="26" height="26"/>
<text x="536" y="163.5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#101828" text-anchor="start">Secret — the app registration’s client secret</text>
<text x="536" y="180" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">read back as an app setting at boot</text>
<rect x="536" y="189.5" width="330" height="18" rx="9" fill="#eef5fc" stroke="#c5dcf2" stroke-width="1"/>
<text x="544" y="202.3" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="10.2" font-weight="600" fill="#0078d4" text-anchor="start">Key Vault Secrets User · held by the managed identity</text>
<rect x="486" y="234" width="456" height="86" rx="9" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.25"/>
<use href="#ic-keyvault" x="500" y="248" width="26" height="26"/>
<text x="536" y="261.5" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#101828" text-anchor="start">Key — the signing key, HSM-backed</text>
<text x="536" y="278" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">never returns private material, under any permission</text>
<rect x="536" y="287.5" width="324" height="18" rx="9" fill="#fdf4ec" stroke="#e6bd93" stroke-width="1"/>
<text x="544" y="300.3" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="10.2" font-weight="600" fill="#b8590a" text-anchor="start">Key Vault Crypto User · held by the app registration</text>
<path d="M322,174.5 C402,174.5 402,179 482,179" fill="none" stroke="#0078d4" stroke-width="1.6" marker-end="url(#ah-azure)"/>
<path d="M322,256 C402,256 402,277 482,277" fill="none" stroke="#b8590a" stroke-width="1.6" marker-end="url(#ah-amber)"/>
<text x="352" y="128" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#0078d4" text-anchor="start">1  reads the secret</text>
<text x="352" y="298" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" fill="#b8590a" text-anchor="start">2  signs with the key</text>
<rect x="20" y="336" width="940" height="106" rx="9" fill="#fbfcfe" stroke="#d5dbe4" stroke-width="1"/>
<text x="38" y="360" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#101828" text-anchor="start">It looks circular, and it is not</text>
<text x="38" y="384" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#2f3944" text-anchor="start">The managed identity is granted Secrets User on the secret; the app registration is granted Crypto User on the key. Two principals, two</text>
<text x="38" y="403" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#2f3944" text-anchor="start">objects, two grants. One vault holds both because a second would buy no isolation — anyone who can read the secret can use the key anyway.</text>
<text x="38" y="422" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6472" text-anchor="start">A key object, not a certificate object: a certificate imported from a PFX is exportable, and a key never returns private material.</text>
</svg>
